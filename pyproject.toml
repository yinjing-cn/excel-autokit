[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "excel-autokit"
version = "0.1.0"
description = "A pure Python CLI + library framework for Excel report automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ChengXiaoHou"},
]
keywords = ["excel", "reconciliation", "data-cleaning", "report-generation", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "pyyaml>=5.4",
    "jinja2>=3.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
charts = [
    "matplotlib>=3.4",
]

[project.scripts]
excel-autokit = "excel_autokit.cli:main"

[project.urls]
Homepage = "https://github.com/chengxiaohou/excel-autokit"
Repository = "https://github.com/chengxiaohou/excel-autokit"
Issues = "https://github.com/chengxiaohou/excel-autokit/issues"

[tool.setuptools.packages.find]
include = ["excel_autokit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["excel_autokit"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
